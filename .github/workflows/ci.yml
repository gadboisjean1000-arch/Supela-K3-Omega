name: CI — OPA Tests, Build, Scan, Push GHCR

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/supela-k3-omega

jobs:
  test-opa:
    name: OPA Policy Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OPA v1.22.4 (SHA-256 verified)
        run: |
          curl -fsSL -o opa https://github.com/open-policy-agent/opa/releases/download/v1.22.4/opa_linux_amd64_static
          echo "35e3b352e715e80624ead6c89930d8585f6f7d94cdc409eb2a9fe36620dcccba  opa" | sha256sum -c -
          chmod +x opa
          sudo mv opa /usr/local/bin/
          opa version

      - name: OPA Format Check
        run: opa fmt --diff policies/ tests/

      - name: OPA Strict Check
        run: opa check --strict policies/ tests/

      - name: OPA Policy Tests (13/13)
        run: opa test policies/ tests/ -v --explain=fails

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-opa
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan-trivy:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy scan (Dockerfile)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          format: sarif
          output: trivy-dockerfile.sarif

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-dockerfile.sarif

  verify-signature:
    name: Verify Cosign Signature (if available)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cosign v3.1.4 (SHA-256 verified)
        run: |
          curl -fsSL -o cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  cosign" | sha256sum -c -
          chmod +x cosign
          sudo mv cosign /usr/local/bin/cosign

      - name: Verify cosign setup
        run: cosign version

      - name: Check for cosign keys
        run: |
          if [ -f cosign.pub ]; then
            echo "cosign.pub found - ready for verification"
          else
            echo "cosign.pub not found - add to repo for production signing"
          fi

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [ test-opa, docker-build, scan-trivy ]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report Status
        run: |
          echo "OPA Policy Tests: PASS"
          echo "Docker Image Built: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Trivy Security Scan: Complete"
          echo "Image available at: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
