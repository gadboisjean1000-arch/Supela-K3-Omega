name: Supela-K3-Omega NEX Suite & 23-Pillar Continuum CI (v4.1.0)

on:
  push:
    branches:
      - supela-2026-epsilon-level4-prep
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  nex-and-continuum-verification:
    name: Execute NEX Suite (NEX-01..04), OMI-XXXX 90d Registry & 20/20 Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Supela-K3-Omega
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install XML Schema validator dependency (lxml / libxml2)
        run: |
          python -m pip install --upgrade pip
          pip install lxml

      - name: Install CNCF Open Policy Agent (opa) binary
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/v1.2.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Execute 23-Pillar Continuum Calculator & Validate Schema v4.1.0
        run: |
          python src/universal_continuum_calculator.py

      - name: Execute Full 20/20 Unit, Negative & NEX Non-Exhaustiveness Test Suite
        run: |
          python -m unittest discover -s tests -v
